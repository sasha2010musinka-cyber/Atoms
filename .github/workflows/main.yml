name: Build Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Если в репозитории лежит только .zip с проектом — автоматически распаковываем его.
      # Если pom.xml уже в корне — используем как есть.
      - name: Unpack project zip (if needed)
        run: |
          set -e
          if [ -f pom.xml ]; then
            PROJ=.
          else
            ZIP=$(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "::error::Не найден ни pom.xml, ни .zip архив с проектом"
              exit 1
            fi
            echo "Распаковка: $ZIP"
            mkdir -p _unpacked
            unzip -q -o "$ZIP" -d _unpacked
            POM=$(find _unpacked -name pom.xml | head -n 1)
            if [ -z "$POM" ]; then
              echo "::error::В архиве нет pom.xml"
              exit 1
            fi
            PROJ=$(dirname "$POM")
          fi
          echo "PROJ_DIR=$PROJ" >> "$GITHUB_ENV"
          echo "Проект: $PROJ"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B -f "$PROJ_DIR/pom.xml" clean package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: AtomSphere-plugin
          path: ${{ env.PROJ_DIR }}/target/*.jar
          if-no-files-found: error

      - name: Publish latest release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: ${{ env.PROJ_DIR }}/target/*.jar
